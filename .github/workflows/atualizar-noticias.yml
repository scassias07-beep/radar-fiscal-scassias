name: Atualizar e publicar notícias fiscais

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/news.json

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-fiscal-pages
  cancel-in-progress: false

jobs:
  atualizar:
    # Um push de data/news.json já contém snapshot saudável coletado externamente;
    # nesse caso, apenas o job de publicação deve rodar.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Coletar notícias
        run: python3 collector/collect.py

      - name: Salvar atualização no repositório
        run: |
          git config user.name 'radar-fiscal-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/news.json
          git diff --cached --quiet || git commit -m 'Atualiza notícias fiscais'
          git push

  publicar:
    needs: atualizar
    # Publica a main após falha ou skip da coleta, usando o último snapshot saudável,
    # mas não inicia a publicação quando o workflow tiver sido cancelado.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy_attempt_1.outputs.page_url }}
    steps:
      - name: Baixar a versão mais recente
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          cp -R data _site/

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages (tentativa 1)
        id: deploy_attempt_1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Aguardar propagação do artefato
        if: ${{ steps.deploy_attempt_1.outcome == 'failure' }}
        run: sleep 5

      - name: Publicar no GitHub Pages (tentativa 2)
        if: ${{ steps.deploy_attempt_1.outcome == 'failure' }}
        id: deployment
        uses: actions/deploy-pages@v4
